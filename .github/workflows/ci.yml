name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'edtech-web/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'edtech-web/**'

jobs:
  dotnet-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./edtech-web/EdTechApi

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: edtech_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ../../tests/EdTechApi.Tests --configuration Release --no-restore
        env:
          JWT_SECRET: ci-jwt-secret-that-is-at-least-thirty-two-characters-long!
          NEON_CONNECTION_STRING: Host=localhost;Database=edtech_test;Username=postgres;Password=test

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./edtech-web/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './edtech-web/frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npx eslint . --ignore-pattern node_modules/ --ext .js
