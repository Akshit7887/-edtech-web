    <main class="main-content">
      <div class="page-header" data-aos="fade-up">
        <div>
          <h1>All Classes</h1>
          <p class="text-muted">Manage all classes across teachers</p>
        </div>
      </div>
      <div id="alert-container"></div>
      <div id="classes-container" class="table-container" data-aos="fade-up" data-aos-delay="100"><div class="loading-overlay"><div class="spinner"></div><span>Loading classes...</span></div></div>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js?v=12"></script>
  <script>AOS.init({ once: true });</script>
  <script src="../../js/api.js?v=12"></script>
  <script src="../../js/auth.js?v=12"></script>
  <script>
    let classPage = 1;
    let classPagination = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireRole('admin')) return;
      setupNavbar();
      await loadClasses(1);
    });

    async function loadClasses(page) {
      classPage = page || classPage;
      try {
        const res = await api.get(`/api/admin/classes?page=${classPage}&limit=50`);
        const data = res.data || [];
        classPagination = res.pagination || { page: 1, total_pages: 1 };
        const container = document.getElementById('classes-container');
        if (!data.length) {
          container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">ðŸ«</div><h3>No classes</h3><p>No classes have been created yet.</p></div>';
          return;
        }
        container.innerHTML = `
          <table class="data-table" style="width:100%">
            <thead><tr><th>Name</th><th>Subject</th><th>Teacher</th><th>Students</th><th>Created</th><th>Actions</th></tr></thead>
            <tbody>
              ${data.map(c => `
                <tr>
                  <td><strong>${escHtml(c.name)}</strong></td>
                  <td>${escHtml(c.subject||'General')}</td>
                  <td>${escHtml(c.teacher_name||'Unknown')}</td>
                  <td>${c.student_count||0}</td>
                  <td>${formatDate(c.created_at)}</td>
                  <td>
                    <div style="display:flex;gap:6px">
                      <button class="btn btn-sm btn-info" onclick="viewClass(${c.id})">ðŸ‘ View</button>
                      <button class="btn btn-sm btn-danger" onclick="handleDeleteClass(${c.id})">Delete</button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          <div style="margin-top:16px;color:var(--text-muted);font-size:0.85rem;display:flex;justify-content:space-between;align-items:center">
            <span>${classPagination.total || data.length} classes total</span>
            <span class="pagination">
              <button onclick="loadClasses(${classPagination.page - 1})" ${classPagination.page <= 1 ? 'disabled' : ''}>â€¹</button>
              <span class="pagination-info">Page ${classPagination.page} of ${classPagination.total_pages}</span>
              <button onclick="loadClasses(${classPagination.page + 1})" ${classPagination.page >= classPagination.total_pages ? 'disabled' : ''}>â€º</button>
            </span>
          </div>
        `;
      } catch (e) {
        document.getElementById('classes-container').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
      }
    }

    async function viewClass(id) {
      try {
        const res = await api.get(`/api/admin/classes/${id}`);
        const d = res.data;
        const c = d.cls;
        const students = d.students || [];
        const allRes = await api.get('/api/admin/users?page=1&limit=1000&role=student');
        const allStudents = allRes.data || [];
        const inClass = new Set(students.map(s => s.id));
        const available = allStudents.filter(s => !inClass.has(s.id));
        const overlay = document.createElement('div'); overlay.className = 'modal-overlay active'; overlay.id = 'class-view-modal';
        overlay.innerHTML = `
          <div class="modal" style="max-width:640px">
            <div class="modal-header"><h3>ðŸ« ${escHtml(c.name)}</h3><button class="modal-close" onclick="closeClassModal()">Ã—</button></div>
            <div class="modal-body">
              <div class="exam-card-meta" style="margin-bottom:var(--space-4)">
                <span>ðŸ“– ${escHtml(c.subject || 'General')}</span>
                <span>ðŸ‘¨â€ðŸ« ${escHtml(c.teacher_name || 'Unknown')}</span>
                <span>ðŸ‘¥ ${c.student_count || 0} students</span>
                ${formatDate(c.created_at)}
              </div>
              <div class="form-group" style="margin-bottom:var(--space-4)">
                <label class="form-label">Add Student</label>
                <div style="display:flex;gap:var(--space-2)">
                  <select class="form-input" id="class-add-student">
                    <option value="">Select a student...</option>
                    ${available.map(s => `<option value="${s.id}">${escHtml(s.name)}${s.student_id ? ' (' + escHtml(s.student_id) + ')' : ''}</option>`).join('')}
                  </select>
                  <button class="btn btn-primary" onclick="addStudentToClass(${c.id})" ${available.length ? '' : 'disabled'}>Add</button>
                </div>
              </div>
              <h4 style="margin:var(--space-3) 0 var(--space-2)">Students (${students.length})</h4>
              <div style="max-height:300px;overflow-y:auto">
                ${students.length ? students.map(s => `
                  <div class="mini-student-item">
                    <div class="student-avatar-sm">${(s.name || '?').charAt(0).toUpperCase()}</div>
                    <div class="student-info">
                      <strong>${escHtml(s.name)}</strong>
                      <span>${escHtml(s.email || '-')}${s.student_id ? ' Â· ID: ' + escHtml(s.student_id) : ''}</span>
                    </div>
                    <button class="btn btn-sm btn-danger" onclick="removeStudentFromClass(${c.id}, ${s.id}, this)">Remove</button>
                  </div>
                `).join('') : '<div class="empty-state" style="padding:var(--space-6)"><p>No students in this class yet.</p></div>'}
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-danger" onclick="handleDeleteClass(${c.id})">ðŸ—‘ Delete Class</button>
              <button class="btn btn-secondary" onclick="closeClassModal()">Close</button>
            </div>
          </div>`;
        document.body.appendChild(overlay);
      } catch (e) { showAlert(e.message, 'error'); }
    }

    function closeClassModal() { const m = document.getElementById('class-view-modal'); if (m) m.remove(); }

    async function addStudentToClass(classId) {
      const sel = document.getElementById('class-add-student');
      const studentId = parseInt(sel.value);
      if (!studentId) { showAlert('Select a student first', 'error'); return; }
      try {
        await api.post(`/api/admin/classes/${classId}/students`, { student_id: studentId });
        showAlert('Student added to class', 'success');
        closeClassModal();
        await viewClass(classId);
        await loadClasses(classPage);
      } catch (e) { showAlert(e.message, 'error'); }
    }

    async function removeStudentFromClass(classId, studentId, btn) {
      if (!confirm('Remove this student from the class?')) return;
      btn.disabled = true; btn.textContent = '...';
      try {
        await api.del(`/api/admin/classes/${classId}/students/${studentId}`);
        showAlert('Student removed', 'success');
        closeClassModal();
        await viewClass(classId);
        await loadClasses(classPage);
      } catch (e) { showAlert(e.message, 'error'); }
    }

    async function handleDeleteClass(id) {
      if (!await confirmAction('Delete this class permanently? Students will be removed from it.')) return;
      try {
        await api.del('/api/admin/classes/' + id);
        showAlert('Class deleted', 'success');
        closeClassModal();
        await loadClasses(classPage);
      } catch (e) { showAlert(e.message, 'error'); }
    }

    function escHtml(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  </script>
