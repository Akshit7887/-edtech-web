<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{if(localStorage.getItem('edtech-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');else if(localStorage.getItem('edtech-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}try{if(document.referrer&&document.referrer.indexOf(location.host)!==-1)document.documentElement.classList.add('page-flip-in')}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Admin Login - EdTech AI Test & Learning App</title>
  <link rel="stylesheet" href="../../css/main.css?v=14">
  <link rel="stylesheet" href="../../css/admin-auth.css?v=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="admin-login-page">

  <nav class="navbar">
    <a href="../../index.html" class="navbar-brand">
      <span class="brand-logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8"/><path d="M8 11h6"/></svg></span>
      EdTech AI Test &amp; Learning App
    </a>
    <ul class="navbar-nav">
      <li><a href="../../index.html">Home</a></li>
      <li><a href="../../login.html">Login</a></li>
      <li><a href="../../register.html">Register</a></li>
    </ul>
    <button class="hamburger-btn" aria-label="Open navigation menu" aria-expanded="false" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hamburger-icon"><line class="hamburger-line top" x1="3" y1="6" x2="21" y2="6"/><line class="hamburger-line mid" x1="3" y1="12" x2="21" y2="12"/><line class="hamburger-line bot" x1="3" y1="18" x2="21" y2="18"/></svg></button>
  </nav>

  <div class="admin-login-card">
    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <h1>Admin Panel</h1>
      <p>EdTech AI Test & Learning App</p>
    </div>
    <div class="alert" id="alert-msg"></div>
    <form id="admin-login-form" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label for="email">Admin Email</label>
        <input type="email" id="email" placeholder="admin@example.com" required autocomplete="email" autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-admin" id="login-btn">Sign In to Admin</button>
      <div class="error-msg" id="error-msg"></div>
    </form>
    <div class="footer">Authorized administrators only</div>
  </div>

  <script src="../../js/api.js?v=14"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const token = api.getToken();
      if (token) {
        const role = localStorage.getItem('user_role');
        if (role === 'admin') window.location.href = '/pages/admin/dashboard.html';
      }
    });

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const alertEl = document.getElementById('alert-msg');

      alertEl.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Signing in...';

      try {
        const res = await fetch(API_BASE + '/api/auth/admin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const json = await res.json();
        if (!res.ok || !json.success) {
          throw new Error(json.error || json.message || 'Login failed');
        }
        const data = json.data;
        api.setToken(data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        localStorage.setItem('user_role', data.user.role);
        localStorage.setItem('user_id', data.user.id);
        localStorage.setItem('user_name', data.user.name);
        alertEl.className = 'alert alert-success';
        alertEl.textContent = 'Login successful! Redirecting...';
        alertEl.style.display = 'block';
        setTimeout(() => window.location.href = '/pages/admin/dashboard.html', 500);
      } catch (e) {
        btn.disabled = false;
        btn.innerHTML = 'Sign In to Admin';
        alertEl.className = 'alert alert-error';
        alertEl.textContent = e.message;
        alertEl.style.display = 'block';
      }
    }
  </script>
  <script src="../../js/nav.js?v=14"></script>
</body>
</html>
