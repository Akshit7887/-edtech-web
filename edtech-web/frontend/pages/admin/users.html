<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{if(localStorage.getItem('edtech-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');else if(localStorage.getItem('edtech-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Manage Users - EdTech AI Test &amp; Learning App</title>
  <link rel="stylesheet" href="../../css/main.css?v=6">
  <link rel="stylesheet" href="../../css/dashboard.css?v=6">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand"><span class="brand-logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8"/><path d="M8 11h6"/></svg></span>EdTech AI Test &amp; Learning App</div>
    <button class="hamburger-btn" aria-label="Open navigation menu" aria-expanded="false" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hamburger-icon"><line class="hamburger-line top" x1="3" y1="6" x2="21" y2="6"/><line class="hamburger-line mid" x1="3" y1="12" x2="21" y2="12"/><line class="hamburger-line bot" x1="3" y1="18" x2="21" y2="18"/></svg></button>
  </nav>
  <div class="layout">
    <aside class="sidebar">
      <ul class="sidebar-nav">
        <li><a href="dashboard.html"><span class="nav-icon">📊</span><span>Dashboard</span></a></li>
        <li><a href="users.html" class="active"><span class="nav-icon">👥</span><span>Users</span></a></li>
        <li><a href="classes.html"><span class="nav-icon">🏫</span><span>Classes</span></a></li>
        <li><a href="departments.html"><span class="nav-icon">🏛️</span><span>Departments</span></a></li>
        <li><a href="exams.html"><span class="nav-icon">📝</span><span>Exams</span></a></li>
        <li><a href="db-monitor.html"><span class="nav-icon">🗄️</span><span>DB Monitor</span></a></li>
        <li><a href="profile.html"><span class="nav-icon">👤</span><span>Profile</span></a></li>
        <li><a href="#" onclick="logout()"><span class="nav-icon">🚪</span><span>Logout</span></a></li>
      </ul>
    </aside>
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Users</h1>
          <p class="text-muted">Manage all platform users</p>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center">
          <select id="role-filter" class="form-input" style="width:auto" onchange="loadUsers(1)">
            <option value="">All Roles</option>
            <option value="student">Students</option>
            <option value="teacher">Teachers</option>
            <option value="admin">Admins</option>
          </select>
          <select id="status-filter" class="form-input" style="width:auto" onchange="loadUsers(1)">
            <option value="">All Statuses</option>
            <option value="pending">Pending Approval</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
          <button class="btn btn-primary" onclick="showAddUserModal()">➕ Add User</button>
        </div>
      </div>
      <div id="alert-container"></div>
      <div class="dashboard-section">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Department</th><th>Phone</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
            <tbody id="users-tbody">
              <tr><td colspan="8"><div class="loading-overlay"><div class="spinner"></div></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="users-pagination"></div>
      </div>
    </main>
  </div>

  <script src="../../js/api.js?v=6"></script>
  <script src="../../js/auth.js?v=6"></script>
  <script>
    let currentPage = 1;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireRole('admin')) return;
      setupNavbar();
      const filter = getQueryParam('filter');
      if (filter === 'pending') {
        document.getElementById('role-filter').value = 'teacher';
        document.getElementById('status-filter').value = 'pending';
      }
      await loadUsers(1);
    });

    function approvalBadge(status) {
      const map = { pending: 'badge-yellow', approved: 'badge-green', rejected: 'badge-red' };
      const cls = map[status] || 'badge-gray';
      return `<span class="badge ${cls}">${(status || 'approved').replace(/_/g, ' ')}</span>`;
    }

    async function loadUsers(page) {
      currentPage = page || currentPage;
      try {
        const role = document.getElementById('role-filter').value;
        const status = document.getElementById('status-filter').value;
        let url = `/api/admin/users?page=${currentPage}&limit=50`;
        if (role) url += '&role=' + role;
        if (status) url += '&status=' + status;
        const res = await api.get(url);
        const users = res.data || [];
        const pagination = res.pagination || { page: 1, total: 0, total_pages: 1 };
        const tbody = document.getElementById('users-tbody');
        if (!users.length) {
          tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state" style="padding:var(--space-8)"><div class="empty-state-icon" style="font-size:2rem">👥</div><h3>No users found</h3></div></td></tr>';
        } else {
          tbody.innerHTML = users.map(u => {
            const approval = u.approval_status || 'approved';
            const isTeacher = u.role === 'teacher';
            const actions = [];
            if (isTeacher && approval !== 'approved') actions.push(`<button class="btn btn-sm btn-primary" onclick="approveTeacher(${u.id})">Approve</button>`);
            if (isTeacher && approval === 'pending') actions.push(`<button class="btn btn-sm btn-danger" onclick="rejectTeacher(${u.id})">Reject</button>`);
            if (approval === 'rejected' && u.rejection_reason) actions.push(`<button class="btn btn-sm btn-ghost" onclick="showRejectReason('${(u.rejection_reason || '').replace(/'/g, "\\'")}')">Why?</button>`);
            actions.push(`<button class="btn btn-sm btn-secondary" onclick="showEditUserModal(${u.id})">✏️</button>`);
            actions.push(`<button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id}, '${(u.name || '').replace(/'/g, "\\'")}')">Delete</button>`);
            return `
            <tr>
              <td><div class="student-row"><div class="student-avatar">${(u.name || '?').charAt(0).toUpperCase()}</div><strong>${u.name}</strong></div></td>
              <td>${u.email || '-'}</td>
              <td>${statusBadge(u.role)}</td>
              <td>${u.department_name || '-'}</td>
              <td>${u.phone || '-'}</td>
              <td>${approvalBadge(approval)}</td>
              <td>${formatDate(u.created_at)}</td>
              <td><div style="display:flex;gap:6px;flex-wrap:wrap">${actions.join('')}</div></td>
            </tr>`;
          }).join('');
        }
        renderPagination(pagination);
      } catch (e) {
        document.getElementById('users-tbody').innerHTML = `<tr><td colspan="8"><div class="alert alert-error">${e.message}</div></td></tr>`;
      }
    }

    async function approveTeacher(id) {
      if (!await confirmAction('Approve this teacher? They will be able to log in immediately.')) return;
      try {
        await api.post('/api/admin/teachers/' + id + '/approve');
        showAlert('Teacher approved', 'success');
        loadUsers(currentPage);
      } catch (e) { showAlert(e.message, 'error'); }
    }

    async function rejectTeacher(id) {
      const reason = prompt('Reason for rejection (optional):', '');
      if (reason === null) return;
      if (!await confirmAction('Reject this teacher? They will not be able to log in.')) return;
      try {
        await api.post('/api/admin/teachers/' + id + '/reject', { rejection_reason: reason });
        showAlert('Teacher rejected', 'success');
        loadUsers(currentPage);
      } catch (e) { showAlert(e.message, 'error'); }
    }

    function showRejectReason(reason) {
      alert('Rejection reason: ' + reason);
    }

    function renderPagination(p) {
      const el = document.getElementById('users-pagination');
      if (p.total_pages <= 1) { el.innerHTML = ''; return; }
      let html = `<button onclick="loadUsers(1)" ${p.page <= 1 ? 'disabled' : ''}>«</button>`;
      html += `<button onclick="loadUsers(${p.page - 1})" ${p.page <= 1 ? 'disabled' : ''}>‹</button>`;
      html += `<span class="pagination-info">Page ${p.page} of ${p.total_pages}</span>`;
      html += `<button onclick="loadUsers(${p.page + 1})" ${p.page >= p.total_pages ? 'disabled' : ''}>›</button>`;
      html += `<button onclick="loadUsers(${p.total_pages})" ${p.page >= p.total_pages ? 'disabled' : ''}>»</button>`;
      el.innerHTML = html;
    }

    function deleteUser(id, name) {
      if (!confirm(`Delete user "${name}"? This permanently removes the account and all related data.`)) return;
      api.del(`/api/admin/users/${id}`).then(() => {
        showAlert('User deleted', 'success');
        loadUsers(currentPage);
      }).catch(e => showAlert(e.message, 'error'));
    }

    let departmentsCache = [];

    async function loadDepts() {
      if (departmentsCache.length) return departmentsCache;
      try {
        const res = await api.get('/api/departments');
        departmentsCache = res.data || [];
      } catch (e) { departmentsCache = []; }
      return departmentsCache;
    }

    function deptOptions(selectedId) {
      return `<option value="">No department</option>` + departmentsCache.map(d => `<option value="${d.id}" ${selectedId === d.id ? 'selected' : ''}>${escHtml(d.name)}</option>`).join('');
    }

    function escHtml(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    async function showAddUserModal() {
      await loadDepts();
      const overlay = document.createElement('div'); overlay.className = 'modal-overlay active'; overlay.id = 'user-modal';
      overlay.innerHTML = `
        <div class="modal" style="max-width:520px">
          <div class="modal-header"><h3>➕ Add User</h3><button class="modal-close" onclick="closeUserModal()">×</button></div>
          <div class="modal-body">
            <div class="form-group form-floating"><input class="form-input" id="u-name" placeholder=" "><label class="form-label">Full Name *</label></div>
            <div class="form-group form-floating"><input class="form-input" id="u-email" type="email" placeholder=" "><label class="form-label">Email *</label></div>
            <div class="form-group form-floating"><input class="form-input" id="u-phone" placeholder=" "><label class="form-label">Phone</label></div>
            <div class="form-group form-floating"><input class="form-input" id="u-password" type="password" placeholder=" "><label class="form-label">Password (min 6 chars) *</label></div>
            <div class="form-group form-floating"><input class="form-input" id="u-student-id" placeholder=" "><label class="form-label">Student ID (optional)</label></div>
            <div class="row">
              <div class="col-2">
                <div class="form-group"><label class="form-label">Role</label>
                  <select class="form-input" id="u-role"><option value="student">Student</option><option value="teacher">Teacher</option><option value="admin">Admin</option></select>
                </div>
              </div>
              <div class="col-2">
                <div class="form-group"><label class="form-label">Department</label>
                  <select class="form-input" id="u-dept">${deptOptions(null)}</select>
                </div>
              </div>
            </div>
            <div class="form-group" id="u-approval-wrap" style="display:none"><label class="form-label">Approval Status</label>
              <select class="form-input" id="u-approval"><option value="approved">Approved</option><option value="pending">Pending</option><option value="rejected">Rejected</option></select>
            </div>
          </div>
          <div class="modal-footer"><button class="btn btn-secondary" onclick="closeUserModal()">Cancel</button><button class="btn btn-primary" onclick="handleAddUser()">Create User</button></div>
        </div>`;
      document.body.appendChild(overlay);
      document.getElementById('u-role').addEventListener('change', () => {
        document.getElementById('u-approval-wrap').style.display = document.getElementById('u-role').value === 'teacher' ? 'block' : 'none';
      });
    }

    function closeUserModal() { const m = document.getElementById('user-modal'); if (m) m.remove(); }

    async function handleAddUser() {
      const payload = {
        name: document.getElementById('u-name').value.trim(),
        email: document.getElementById('u-email').value.trim(),
        phone: document.getElementById('u-phone').value.trim() || null,
        password: document.getElementById('u-password').value,
        role: document.getElementById('u-role').value,
        student_id: document.getElementById('u-student-id').value.trim() || null,
        department_id: parseInt(document.getElementById('u-dept').value) || null
      };
      if (!payload.name || !payload.email || !payload.password) { showAlert('Name, email and password are required', 'error'); return; }
      if (payload.password.length < 6) { showAlert('Password must be at least 6 characters', 'error'); return; }
      if (payload.role === 'teacher') payload.approval_status = document.getElementById('u-approval').value;
      try {
        await api.post('/api/admin/users', payload);
        showAlert('User created!', 'success');
        closeUserModal();
        loadUsers(currentPage);
      } catch (e) { showAlert(e.message, 'error'); }
    }

    async function showEditUserModal(id) {
      const res = await api.get('/api/admin/users?page=1&limit=1000');
      const user = (res.data || []).find(u => u.id === id);
      if (!user) { showAlert('User not found', 'error'); return; }
      await loadDepts();
      const overlay = document.createElement('div'); overlay.className = 'modal-overlay active'; overlay.id = 'user-modal';
      overlay.innerHTML = `
        <div class="modal" style="max-width:520px">
          <div class="modal-header"><h3>✏️ Edit User</h3><button class="modal-close" onclick="closeUserModal()">×</button></div>
          <div class="modal-body">
            <div class="form-group form-floating"><input class="form-input" id="u-name" placeholder=" " value="${escHtml(user.name)}"><label class="form-label">Full Name</label></div>
            <div class="form-group form-floating"><input class="form-input" id="u-email" type="email" placeholder=" " value="${escHtml(user.email || '')}"><label class="form-label">Email</label></div>
            <div class="form-group form-floating"><input class="form-input" id="u-phone" placeholder=" " value="${escHtml(user.phone || '')}"><label class="form-label">Phone</label></div>
            <div class="form-group form-floating"><input class="form-input" id="u-password" type="password" placeholder=" "><label class="form-label">New Password (leave blank to keep)</label></div>
            <div class="form-group form-floating"><input class="form-input" id="u-student-id" placeholder=" " value="${escHtml(user.student_id || '')}"><label class="form-label">Student ID</label></div>
            <div class="row">
              <div class="col-2">
                <div class="form-group"><label class="form-label">Role</label>
                  <select class="form-input" id="u-role">
                    <option value="student" ${user.role === 'student' ? 'selected' : ''}>Student</option>
                    <option value="teacher" ${user.role === 'teacher' ? 'selected' : ''}>Teacher</option>
                    <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>Admin</option>
                  </select>
                </div>
              </div>
              <div class="col-2">
                <div class="form-group"><label class="form-label">Department</label>
                  <select class="form-input" id="u-dept">${deptOptions(user.department_id || null)}</select>
                </div>
              </div>
            </div>
            <div class="form-group"><label class="form-label">Approval Status</label>
              <select class="form-input" id="u-approval">
                <option value="approved" ${user.approval_status === 'approved' ? 'selected' : ''}>Approved</option>
                <option value="pending" ${user.approval_status === 'pending' ? 'selected' : ''}>Pending</option>
                <option value="rejected" ${user.approval_status === 'rejected' ? 'selected' : ''}>Rejected</option>
              </select>
            </div>
          </div>
          <div class="modal-footer"><button class="btn btn-secondary" onclick="closeUserModal()">Cancel</button><button class="btn btn-primary" onclick="handleEditUser(${user.id})">Save Changes</button></div>
        </div>`;
      document.body.appendChild(overlay);
    }

    async function handleEditUser(id) {
      const payload = {
        name: document.getElementById('u-name').value.trim() || null,
        email: document.getElementById('u-email').value.trim() || null,
        phone: document.getElementById('u-phone').value.trim() || '',
        password: document.getElementById('u-password').value || null,
        role: document.getElementById('u-role').value,
        student_id: document.getElementById('u-student-id').value.trim() || '',
        department_id: parseInt(document.getElementById('u-dept').value) || null,
        approval_status: document.getElementById('u-approval').value
      };
      try {
        await api.put(`/api/admin/users/${id}`, payload);
        showAlert('User updated!', 'success');
        closeUserModal();
        loadUsers(currentPage);
      } catch (e) { showAlert(e.message, 'error'); }
    }
  </script>
  <script src="../../js/nav.js?v=6"></script>
</body>
</html>
