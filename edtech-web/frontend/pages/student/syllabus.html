<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllabus - EdTech AI Test &amp; Learning App</title>
  <link rel="stylesheet" href="../../css/main.css?v=3">
  <link rel="stylesheet" href="../../css/dashboard.css?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .syllabus-search { display: flex; gap: var(--space-3); margin-bottom: var(--space-6); }
    .syllabus-search input { flex: 1; }
    .syllabus-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-4); }
    .syllabus-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-5); transition: all var(--duration-normal) var(--ease); display: flex; flex-direction: column; }
    .syllabus-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
    .syllabus-card-icon { font-size: 2rem; margin-bottom: var(--space-3); }
    .syllabus-card h3 { font-size: var(--text-base); font-weight: 600; margin-bottom: var(--space-1); color: var(--text-heading); }
    .syllabus-card p { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-3); flex: 1; }
    .syllabus-card-meta { font-size: var(--text-xs); color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; padding-top: var(--space-3); border-top: 1px solid var(--border-light); }
    .syllabus-card-actions { display: flex; gap: var(--space-2); margin-top: var(--space-3); }
    .file-type-badge { font-size: 0.7rem; text-transform: uppercase; font-weight: 600; padding: 2px 8px; border-radius: var(--radius-full); background: var(--accent-ghost); color: var(--accent); }
    .empty-state { text-align: center; padding: var(--space-12); color: var(--text-muted); }
    .empty-state-icon { font-size: 3rem; margin-bottom: var(--space-4); opacity: 0.5; }
    .class-syllabus-block { margin-bottom: var(--space-8); }
    .class-syllabus-header { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); padding-bottom: var(--space-3); border-bottom: 2px solid var(--border-strong); }
    .class-syllabus-header-icon { font-size: 1.5rem; }
    .class-syllabus-header h2 { font-size: var(--text-lg); font-weight: 700; color: var(--text-heading); }
    .class-syllabus-header .class-meta { font-size: var(--text-sm); color: var(--text-muted); margin-top: 2px; }
    .class-syllabus-count { margin-left: auto; font-size: var(--text-xs); font-weight: 600; color: var(--text-muted); background: var(--bg-secondary); padding: 4px 12px; border-radius: var(--radius-full); white-space: nowrap; }
    .class-syllabus-empty { padding: var(--space-4); border: 1px dashed var(--border-strong); border-radius: var(--radius-lg); color: var(--text-muted); font-size: var(--text-sm); text-align: center; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="dashboard.html" class="navbar-brand">
      <span class="brand-logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8"/><path d="M8 11h6"/></svg></span>
      EdTech AI Test &amp; Learning App
    </a>
    <button class="hamburger-btn" aria-label="Open navigation menu" aria-expanded="false" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hamburger-icon"><line class="hamburger-line top" x1="3" y1="6" x2="21" y2="6"/><line class="hamburger-line mid" x1="3" y1="12" x2="21" y2="12"/><line class="hamburger-line bot" x1="3" y1="18" x2="21" y2="18"/></svg></button>
  </nav>
  <div class="layout">
    <aside class="sidebar">
      <ul class="sidebar-nav">
        <li><a href="dashboard.html"><span class="nav-icon">&#x1F4CA;</span><span>Dashboard</span></a></li>
        <li><a href="profile.html"><span class="nav-icon">&#x1F464;</span><span>Profile &amp; Settings</span></a></li>
        <li><a href="results.html"><span class="nav-icon">&#x1F4DD;</span><span>My Results</span></a></li>
        <li><a href="syllabus.html" class="active"><span class="nav-icon">&#x1F4DA;</span><span>Syllabus</span></a></li>
        <li><a href="notifications.html"><span class="nav-icon">&#x1F514;</span><span>Notifications</span></a></li>
        <li><a href="#" onclick="logout()"><span class="nav-icon">&#x1F6AA;</span><span>Logout</span></a></li>
      </ul>
    </aside>
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Syllabus</h1>
          <p class="text-muted">Browse and download syllabus files for your classes</p>
        </div>
      </div>
      <div id="alert-container"></div>

      <div class="syllabus-search">
        <input type="text" class="form-input" id="search-input" placeholder="Search syllabus files..." oninput="applyFilter()">
      </div>

      <div id="syllabus-grid" class="syllabus-grid"></div>
    </main>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    let allFiles = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireRole('student')) return;
      await loadFiles();
      startPolling(loadFiles, 60000);
      window.addEventListener('beforeunload', stopPolling);
    });

    async function loadFiles() {
      const grid = document.getElementById('syllabus-grid');
      grid.innerHTML = '<div class="empty-state"><div class="spinner"></div><p>Loading files...</p></div>';
      try {
        const res = await api.get('/api/syllabus/my');
        allFiles = res.data || [];
        renderFiles(allFiles);
      } catch (e) {
        grid.innerHTML = '<div class="empty-state"><p>Failed to load syllabus files</p></div>';
      }
    }

    function applyFilter() {
      const q = document.getElementById('search-input').value.trim().toLowerCase();
      if (!q) { renderFiles(allFiles); return; }
      const filtered = allFiles.filter(f =>
        (f.title || '').toLowerCase().includes(q) ||
        (f.description || '').toLowerCase().includes(q) ||
        (f.class_name || '').toLowerCase().includes(q)
      );
      renderFiles(filtered);
    }

    function renderFiles(files) {
      const grid = document.getElementById('syllabus-grid');
      if (!files.length) {
        grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#x1F4DA;</div><p>No syllabus files available for your classes yet</p><p class="text-sm">Ask your teacher to upload syllabus files for your class.</p></div>';
        return;
      }

      const grouped = new Map();
      files.forEach(f => {
        if (!grouped.has(f.class_id)) grouped.set(f.class_id, { id: f.class_id, name: f.class_name || 'My Class', subject: f.class_subject, files: [] });
        grouped.get(f.class_id).files.push(f);
      });

      const blocks = [];
      [...grouped.values()].forEach(g => {
        blocks.push(`
          <div class="class-syllabus-block">
            <div class="class-syllabus-header">
              <span class="class-syllabus-header-icon">&#x1F3EB;</span>
              <div>
                <h2>${escHtml(g.name)}</h2>
                ${g.subject ? '<div class="class-meta">' + escHtml(g.subject) + '</div>' : ''}
              </div>
              <span class="class-syllabus-count">${g.files.length} file${g.files.length !== 1 ? 's' : ''}</span>
            </div>
            <div class="syllabus-grid">${g.files.map(fileCard).join('')}</div>
          </div>`);
      });

      grid.innerHTML = blocks.join('');
    }

    function fileCard(f) {
      const ext = (f.file_name || '').split('.').pop().toUpperCase();
      const icon = ext === 'PDF' ? '&#x1F4C4;' : ext === 'DOC' || ext === 'DOCX' ? '&#x1F4DD;' : ext === 'PPT' || ext === 'PPTX' ? '&#x1F4CA;' : '&#x1F4C1;';
      const size = f.file_size > 1024 * 1024 ? (f.file_size / 1024 / 1024).toFixed(1) + ' MB' : (f.file_size / 1024).toFixed(0) + ' KB';
      const url = `${API_BASE}/api/syllabus/${f.id}/download`;
      return `<div class="syllabus-card">
          <div class="syllabus-card-icon">${icon}</div>
          <h3>${escHtml(f.title)}</h3>
          <p>${f.description ? escHtml(f.description) : 'No description'}</p>
          <div class="syllabus-card-meta">
            <span class="file-type-badge">${ext}</span>
            <span>${size}</span>
          </div>
          <div class="syllabus-card-meta">
            <span>by ${escHtml(f.uploader_name || 'Unknown')}</span>
            <span>${formatDate(f.created_at)}</span>
          </div>
          <div class="syllabus-card-actions">
            <a href="${url}" class="btn btn-sm btn-primary" target="_blank" download>Download</a>
          </div>
        </div>`;
    }

    function escHtml(s) {
      if (!s) return '';
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/animations.js"></script>
</body>
</html>
