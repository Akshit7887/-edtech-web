<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{if(localStorage.getItem('edtech-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');else if(localStorage.getItem('edtech-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}try{if(document.referrer&&document.referrer.indexOf(location.host)!==-1)document.documentElement.classList.add('page-flip-in')}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Syllabus - EdTech AI Test &amp; Learning App</title>
  <link rel="stylesheet" href="../../css/main.css?v=12">
  <link rel="stylesheet" href="../../css/dashboard.css?v=12">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .syllabus-search { display: flex; gap: var(--space-3); margin-bottom: var(--space-6); flex-wrap: wrap; }
    .syllabus-search input { flex: 1; min-width: 0; }
    .syllabus-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-3); }
    .file-type-badge { font-size: 0.7rem; text-transform: uppercase; font-weight: 600; padding: 2px 8px; border-radius: var(--radius-full); background: var(--accent-ghost); color: var(--accent); white-space: nowrap; }
    .empty-state { text-align: center; padding: var(--space-12); color: var(--text-muted); }
    .empty-state-icon { font-size: 3rem; margin-bottom: var(--space-4); opacity: 0.5; }
    .class-syllabus-count { font-size: var(--text-xs); font-weight: 600; color: var(--text-muted); background: var(--bg-muted); padding: 4px 12px; border-radius: var(--radius-full); white-space: nowrap; }
    .class-syllabus-header-icon { font-size: 1.5rem; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="dashboard.html" class="navbar-brand">
      <span class="brand-logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8"/><path d="M8 11h6"/></svg></span>
      EdTech AI Test &amp; Learning App
    </a>
    <button class="hamburger-btn" aria-label="Open navigation menu" aria-expanded="false" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hamburger-icon"><line class="hamburger-line top" x1="3" y1="6" x2="21" y2="6"/><line class="hamburger-line mid" x1="3" y1="12" x2="21" y2="12"/><line class="hamburger-line bot" x1="3" y1="18" x2="21" y2="18"/></svg></button>
  </nav>
  <div class="layout">
    <aside class="sidebar">
      <ul class="sidebar-nav">
        <li><a href="dashboard.html"><span class="nav-icon">&#x1F4CA;</span><span>Dashboard</span></a></li>
        <li><a href="profile.html"><span class="nav-icon">&#x1F464;</span><span>Profile &amp; Settings</span></a></li>
        <li><a href="results.html"><span class="nav-icon">&#x1F4DD;</span><span>My Results</span></a></li>
        <li><a href="syllabus.html" class="active"><span class="nav-icon">&#x1F4DA;</span><span>Syllabus</span></a></li>
        <li><a href="notifications.html"><span class="nav-icon">&#x1F514;</span><span>Notifications</span></a></li>
        <li><a href="#" onclick="logout()"><span class="nav-icon">&#x1F6AA;</span><span>Logout</span></a></li>
      </ul>
    </aside>
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Syllabus</h1>
          <p class="text-muted">Pick a class to view its syllabus files</p>
        </div>
      </div>
      <div id="alert-container"></div>

      <!-- MAIN VIEW: one card per class -->
      <section id="main-view">
        <div class="syllabus-search">
          <input type="text" class="form-input" id="search-input" placeholder="Search classes or files..." oninput="applyFilter()">
        </div>
        <div id="class-grid" class="syllabus-grid"></div>
      </section>

      <!-- CLASS FILES VIEW: all files of the selected class -->
      <section id="class-section" class="syllabus-section">
        <div class="syllabus-section-header">
          <button class="back-btn" id="class-back" type="button" aria-label="Back to classes"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
          <span class="class-syllabus-header-icon">&#x1F3EB;</span>
          <div>
            <h2 id="class-name">Class</h2>
            <div class="class-meta" id="class-subject"></div>
          </div>
          <span class="class-syllabus-count" id="class-count"></span>
        </div>
        <div id="file-grid" class="syllabus-grid"></div>
      </section>

      <!-- FILE VIEWER: view / download the selected document -->
      <section id="viewer-section" class="syllabus-section">
        <div class="file-viewer-panel">
          <div class="file-viewer-header">
            <button class="back-btn" id="viewer-back" type="button" aria-label="Back to files"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
            <h3 id="viewer-title">Document</h3>
            <button type="button" class="btn btn-sm btn-primary" id="viewer-download">Download</button>
          </div>
          <iframe id="viewer-frame" class="file-viewer-frame" title="Document viewer"></iframe>
          <div id="viewer-unavailable" class="file-viewer-unavailable" style="display:none">
            <div class="viewer-icon">&#x1F4C1;</div>
            <p>Preview is not available for this file type.</p>
            <p class="text-sm">Use the Download button to open it.</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../../js/api.js?v=12"></script>
  <script src="../../js/auth.js?v=12"></script>
  <script>
    let allFiles = [];
    let groupsCache = [];
    let currentClass = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireRole('student')) return;
      await loadFiles();
      startPolling(loadFiles, 60000);
      window.addEventListener('beforeunload', stopPolling);

      document.getElementById('class-back').addEventListener('click', () => { currentClass = null; showSection('main-view'); });
      document.getElementById('viewer-back').addEventListener('click', closeViewer);
      document.getElementById('viewer-download').addEventListener('click', downloadViewer);
    });

    async function loadFiles() {
      const grid = document.getElementById('class-grid');
      grid.innerHTML = '<div class="empty-state"><div class="spinner"></div><p>Loading files...</p></div>';
      try {
        const res = await api.get('/api/syllabus/my');
        allFiles = res.data || [];
        renderClasses(allFiles);
      } catch (e) {
        grid.innerHTML = '<div class="empty-state"><p>Failed to load syllabus files</p></div>';
      }
    }

    function applyFilter() {
      const q = document.getElementById('search-input').value.trim().toLowerCase();
      if (!q) { renderClasses(allFiles); return; }
      const filtered = allFiles.filter(f =>
        (f.title || '').toLowerCase().includes(q) ||
        (f.description || '').toLowerCase().includes(q) ||
        (f.class_name || '').toLowerCase().includes(q) ||
        (f.class_subject || '').toLowerCase().includes(q)
      );
      renderClasses(filtered);
    }

    function groupByClass(files) {
      const map = new Map();
      files.forEach(f => {
        const key = f.class_id ? String(f.class_id) : 'unassigned';
        if (!map.has(key)) {
          map.set(key, {
            id: f.class_id,
            name: f.class_name || 'General Syllabus',
            subject: f.class_subject || '',
            files: []
          });
        }
        map.get(key).files.push(f);
      });
      return [...map.values()];
    }

    function renderClasses(files) {
      const grid = document.getElementById('class-grid');
      if (!files.length) {
        grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#x1F4DA;</div><p>No syllabus files available for your classes yet</p><p class="text-sm">Ask your teacher to upload syllabus files for your class.</p></div>';
        return;
      }

      groupsCache = groupByClass(files);
      grid.innerHTML = groupsCache.map((g, i) => {
        const count = g.files.length;
        const fileList = g.files.slice(0, 3).map(f => `<li title="${escHtml(f.title)}">${escHtml(f.title)}</li>`).join('');
        const more = count > 3 ? `<li class="more">+${count - 3} more file${count - 3 !== 1 ? 's' : ''}</li>` : '';
        return `<div class="smart-card anim-fade-up" style="animation-delay:${i * 0.05}s">
          <div class="smart-card-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
          <div class="smart-card-body">
            <div class="smart-card-title">${escHtml(g.name)}</div>
            <div class="smart-card-subtitle">${g.subject ? escHtml(g.subject) : count + ' file' + (count !== 1 ? 's' : '') + ' available'}</div>
            ${fileList ? `<ul class="smart-card-files">${fileList}${more}</ul>` : ''}
          </div>
          <div class="smart-card-actions">
            <span class="file-type-badge">${count} file${count !== 1 ? 's' : ''}</span>
            <button class="btn btn-xs btn-primary" type="button" onclick="openClass(${i})">View</button>
          </div>
        </div>`;
      }).join('');
    }

    function openClass(i) {
      currentClass = groupsCache[i];
      if (!currentClass) return;
      document.getElementById('class-name').textContent = currentClass.name;
      document.getElementById('class-subject').textContent = currentClass.subject || 'General Syllabus';
      const count = currentClass.files.length;
      document.getElementById('class-count').textContent = count + ' file' + (count !== 1 ? 's' : '');
      renderFileGrid(currentClass.files);
      showSection('class-section');
    }

    function renderFileGrid(files) {
      const grid = document.getElementById('file-grid');
      if (!files.length) {
        grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#x1F4C1;</div><p>No files in this class yet</p></div>';
        return;
      }
      grid.innerHTML = files.map((f, i) => fileCard(f, i)).join('');
    }

    function fileCard(f, i) {
      const ext = (f.file_name || '').split('.').pop().toUpperCase();
      const isPdf = ext === 'PDF';
      const size = f.file_size > 1024 * 1024 ? (f.file_size / 1024 / 1024).toFixed(1) + ' MB' : (f.file_size / 1024).toFixed(0) + ' KB';
      const icon = isPdf
        ? '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>'
        : '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>';
      return `<div class="smart-card anim-fade-up" style="animation-delay:${i * 0.04}s">
          <div class="smart-card-icon">${icon}</div>
          <div class="smart-card-body">
            <div class="smart-card-title">${escHtml(f.title)}</div>
            <div class="smart-card-subtitle">${f.description ? escHtml(f.description) : `by ${escHtml(f.uploader_name || 'Unknown')}`}</div>
          </div>
          <div class="smart-card-actions">
            <span class="file-type-badge">${ext} &middot; ${size}</span>
            <div style="display:flex;gap:var(--space-2);flex-wrap:wrap">
              <button class="btn btn-xs btn-secondary" type="button" onclick="openFileViewer(${i})">View</button>
              <button class="btn btn-xs btn-primary" type="button" onclick="downloadFile(${i})">Download</button>
            </div>
          </div>
        </div>`;
    }

    let viewerFile = null;
    let viewerBlobUrl = null;
    let viewerSeq = 0;

    function releaseViewerUrl() {
      if (viewerBlobUrl) { URL.revokeObjectURL(viewerBlobUrl); viewerBlobUrl = null; }
    }

    async function openFileViewer(i) {
      const f = currentClass.files[i];
      if (!f) return;
      const seq = ++viewerSeq;
      viewerFile = f;
      const ext = (f.file_name || '').split('.').pop().toLowerCase();
      document.getElementById('viewer-title').textContent = f.title;
      const frame = document.getElementById('viewer-frame');
      const unavailable = document.getElementById('viewer-unavailable');
      const unavailableMsg = unavailable.querySelector('p');
      showSection('viewer-section');
      releaseViewerUrl();
      if (ext === 'pdf' || ext === 'txt') {
        frame.style.display = 'block';
        unavailable.style.display = 'none';
        frame.src = 'about:blank';
        try {
          const url = await api.fetchBlobUrl(`/api/syllabus/${f.id}/download`);
          if (seq !== viewerSeq) { URL.revokeObjectURL(url); return; }
          viewerBlobUrl = url;
          frame.src = url;
        } catch (e) {
          if (seq !== viewerSeq) return;
          frame.style.display = 'none';
          unavailable.style.display = 'flex';
          unavailableMsg.textContent = 'Could not load this file: ' + (e.message || 'network error');
        }
      } else {
        frame.style.display = 'none';
        frame.src = 'about:blank';
        unavailable.style.display = 'flex';
        unavailableMsg.textContent = 'Preview is not available for this file type.';
      }
    }

    function downloadViewer() {
      if (!viewerFile) return;
      downloadFileById(viewerFile.id, viewerFile.file_name || viewerFile.title + '.pdf');
    }

    function downloadFile(i) {
      const f = currentClass.files[i];
      if (!f) return;
      downloadFileById(f.id, f.file_name || f.title + '.pdf');
    }

    async function downloadFileById(id, filename) {
      try {
        const blob = await api.downloadFile(`/api/syllabus/${id}/download`);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      } catch (e) {
        showAlert(e.message || 'Download failed', 'error');
      }
    }

    function closeViewer() {
      viewerSeq++;
      releaseViewerUrl();
      document.getElementById('viewer-frame').src = 'about:blank';
      viewerFile = null;
      showSection('class-section');
    }

    function showSection(id) {
      ['main-view', 'class-section', 'viewer-section'].forEach(s => {
        document.getElementById(s).classList.toggle('active', s === id);
      });
      if (id !== 'main-view') {
        const el = document.getElementById(id);
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        window.scrollBy(0, -90);
      }
    }

    function escHtml(s) {
      if (s === null || s === undefined) return '';
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
  <script src="../../js/nav.js?v=12"></script>
  <script src="../../js/animations.js?v=12"></script>
</body>
</html>
