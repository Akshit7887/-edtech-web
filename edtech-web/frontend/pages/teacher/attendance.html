<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Attendance - EdTech AI Test &amp; Learning App</title>
  <link rel="stylesheet" href="../../css/main.css?v=13">
  <link rel="stylesheet" href="../../css/dashboard.css?v=12">

<body>
  <nav class="navbar">
    <div class="navbar-brand"><span class="brand-logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8"/><path d="M8 11h6"/></svg></span>EdTech AI Test &amp; Learning App</div>
    <button class="hamburger-btn" aria-label="Open navigation menu" aria-expanded="false" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hamburger-icon"><line class="hamburger-line top" x1="3" y1="6" x2="21" y2="6"/><line class="hamburger-line mid" x1="3" y1="12" x2="21" y2="12"/><line class="hamburger-line bot" x1="3" y1="18" x2="21" y2="18"/></svg></button>
  </nav>
  <div class="layout">
    <aside class="sidebar">
      <ul class="sidebar-nav">
        <li><a href="dashboard.html"><span class="nav-icon">ðŸ“Š</span><span>Dashboard</span></a></li>
        <li><a href="edit-exam.html?id=" id="back-link"><span class="nav-icon">â†</span><span>Back to Exam</span></a></li>
        <li><a href="attendance.html" class="active"><span class="nav-icon">âœ…</span><span>Attendance</span></a></li>
        <li><a href="#" onclick="logout()"><span class="nav-icon">ðŸšª</span><span>Logout</span></a></li>
      </ul>
    </aside>
    <main class="main-content">
      <div id="alert-container"></div>
      <div id="attendance-content" data-aos="fade-up"><div class="loading-overlay"><div class="spinner"></div><span>Loading attendance...</span></div></div>
    </main>
  </div>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js?v=12"></script>
  <script>AOS.init({ once: true });</script>
  <script src="../../js/api.js?v=12"></script>
  <script src="../../js/auth.js?v=12"></script>
  <script src="../../js/teacher.js?v=12"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireRole('teacher')) return;
      setupNavbar();
      const examId = parseInt(getQueryParam('id'));
      if (!examId) {
        document.getElementById('back-link').href = 'dashboard.html';
        const latestId = await renderExamPicker('attendance-content', 'Attendance Report', 'attendance.html?id=');
        if (latestId) {
          document.getElementById('back-link').href = `edit-exam.html?id=${latestId}`;
          await loadAttendance(latestId, 'latest-exam-content');
        }
        return;
      }
      document.getElementById('back-link').href = `edit-exam.html?id=${examId}`;
      await loadAttendance(examId);
    });

    async function loadAttendance(examId, containerId = 'attendance-content') {
      const container = document.getElementById(containerId);
      try {
        const report = await getAttendanceReport(examId);
        if (!report) { container.innerHTML = '<div class="alert alert-error">Failed to load attendance</div>'; return; }
        container.innerHTML = `
          <div class="dashboard-header">
            <h1>Attendance Report</h1>
            <p>Exam attendance tracking</p>
          </div>
          <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon">âœ…</div><div class="stat-value">${report.present != null ? report.present : (report.present_count || 0)}</div><div class="stat-label">Present</div></div>
            <div class="stat-card"><div class="stat-icon">âŒ</div><div class="stat-value">${report.absent != null ? report.absent : (report.absent_count || 0)}</div><div class="stat-label">Absent</div></div>
            <div class="stat-card"><div class="stat-icon">ðŸ‘¥</div><div class="stat-value">${report.total != null ? report.total : (report.present || 0) + (report.absent || 0)}</div><div class="stat-label">Total</div></div>
          </div>
          <div class="table-container">
            <table>
              <thead><tr><th>Student</th><th>Email</th><th>Status</th><th>Marked At</th></tr></thead>
              <tbody>
                ${(report.students || []).map(s => `
                  <tr>
                    <td><strong>${s.student_name}</strong></td>
                    <td>${s.student_email || '-'}</td>
                    <td>${statusBadge(s.status)}</td>
                    <td>${formatDate(s.marked_at)}</td>
                  </tr>
                `).join('')}
                ${(!report.students || !report.students.length) ? '<tr><td colspan="4"><div class="empty-state" style="padding:20px">No attendance records</div></td></tr>' : ''}
              </tbody>
            </table>
          </div>
        `;
      } catch (e) {
        container.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
      }
    }
  </script>
  <script src="../../js/nav.js?v=12"></script>
</body>
</html>
