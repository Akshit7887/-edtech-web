<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{if(localStorage.getItem('edtech-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');else if(localStorage.getItem('edtech-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}try{if(document.referrer&&document.referrer.indexOf(location.host)!==-1)document.documentElement.classList.add('page-flip-in')}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Manage Questions - EdTech AI Test &amp; Learning App</title>
  <link rel="stylesheet" href="../../css/main.css?v=13">
  <link rel="stylesheet" href="../../css/dashboard.css?v=12">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand"><span class="brand-logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8"/><path d="M8 11h6"/></svg></span>EdTech AI Test &amp; Learning App</div>
    <button class="hamburger-btn" aria-label="Open navigation menu" aria-expanded="false" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hamburger-icon"><line class="hamburger-line top" x1="3" y1="6" x2="21" y2="6"/><line class="hamburger-line mid" x1="3" y1="12" x2="21" y2="12"/><line class="hamburger-line bot" x1="3" y1="18" x2="21" y2="18"/></svg></button>
  </nav>
  <div class="layout">
    <aside class="sidebar">
      <ul class="sidebar-nav">
        <li><a href="dashboard.html"><span class="nav-icon">ðŸ“Š</span><span>Dashboard</span></a></li>
        <li><a href="edit-exam.html?id=" id="back-to-exam"><span class="nav-icon">â†</span><span>Back to Exam</span></a></li>
        <li><a href="questions.html" class="active"><span class="nav-icon">ðŸ“‹</span><span>Questions</span></a></li>
        <li><a href="#" onclick="logout()"><span class="nav-icon">ðŸšª</span><span>Logout</span></a></li>
      </ul>
    </aside>
    <main class="main-content">
      <div id="alert-container"></div>
      <div id="questions-content" data-aos="fade-up"><div class="loading-overlay"><div class="spinner"></div><span>Loading questions...</span></div></div>
    </main>
  </div>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js?v=12"></script>
  <script>AOS.init({ once: true });</script>
  <script src="../../js/api.js?v=12"></script>
  <script src="../../js/auth.js?v=12"></script>
  <script src="../../js/teacher.js?v=12"></script>
  <script>
    let examId = 0;
    let contentContainer = 'questions-content';

    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireRole('teacher')) return;
      setupNavbar();
      examId = parseInt(getQueryParam('examId'));
      if (!examId) {
        document.getElementById('back-to-exam').href = 'dashboard.html';
        const latestId = await renderExamPicker('questions-content', 'Question Bank', 'questions.html?examId=');
        if (latestId) {
          examId = latestId;
          contentContainer = 'latest-exam-content';
          document.getElementById('back-to-exam').href = `edit-exam.html?id=${examId}`;
          await loadQuestions();
        }
        return;
      }
      document.getElementById('back-to-exam').href = `edit-exam.html?id=${examId}`;
      await loadQuestions();
    });

    async function loadQuestions() {
      const container = document.getElementById(contentContainer);
      try {
        const questions = await getQuestionBank(examId);
        const exam = await getExamDetail(examId).catch(() => null);
        container.innerHTML = `
          <div class="dashboard-header" style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <h1>Questions: ${exam?.title || 'Exam'}</h1>
              <p>${questions.length} questions in the bank</p>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn btn-secondary" onclick="showAddModal()">+ Add Question</button>
              <button class="btn btn-info" onclick="showGenerateModal()">ðŸ¤– AI Generate</button>
              <button class="btn btn-success" onclick="handlePublish()">Publish</button>
              <button class="btn btn-primary" onclick="handleAssign()">Assign to Students</button>
            </div>
          </div>
          <div id="questions-table">
            ${questions.length === 0 ? '<div class="empty-state"><div class="empty-state-icon">ðŸ“‹</div><h3>No questions yet</h3><p>Add questions manually or generate with AI.</p></div>' : `
              <div class="table-container">
                <table>
                  <thead><tr><th>#</th><th>Question</th><th>Options</th><th>Answer</th><th>Difficulty</th><th>Points</th><th>Status</th><th>Actions</th></tr></thead>
                  <tbody>
                    ${questions.map((q, i) => `
                      <tr style="animation:fadeInUp 0.3s var(--ease) both;animation-delay:${i * 0.03}s">
                        <td>${i + 1}</td>
                        <td>${(q.question_text || '').substring(0, 60)}${(q.question_text || '').length > 60 ? '...' : ''}</td>
                        <td style="font-size:0.8rem">A:${(q.option_a || '').substring(0,20)} / B:${(q.option_b || '').substring(0,20)}${q.option_c ? ' / C:' + q.option_c.substring(0,20) : ''}${q.option_d ? ' / D:' + q.option_d.substring(0,20) : ''}</td>
                        <td><span class="badge badge-success">${q.correct_answer}</span></td>
                        <td>${statusBadge(q.difficulty)}</td>
                        <td>${q.points || 1}</td>
                        <td>${statusBadge(q.status)}</td>
                        <td>
                          <button class="btn btn-sm btn-ghost" onclick="editQuestion(${q.id}, ${i})">âœï¸</button>
                          <button class="btn btn-sm btn-danger" onclick="handleDeleteQ(${q.id})">ðŸ—‘ï¸</button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `}
          </div>
        `;
      } catch (e) {
        container.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
      }
    }

    function showAddModal() { showQuestionModal(); }
    async function showGenerateModal() {
      let syllabusText = '';
      try {
        const exam = await getExamDetail(examId);
        if (exam) syllabusText = exam.syllabus_text || '';
      } catch (e) {}
      const html = `
        <div class="form-group"><label class="form-label">Question Count</label><input type="number" class="form-input" id="gen-count" value="5" min="1"></div>
        <div class="form-group"><label class="form-label">Difficulty</label><select class="form-select" id="gen-difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></div>
        <div class="form-group"><label class="form-label">Syllabus / Topic (used as context for generation)</label><textarea class="form-textarea" id="gen-syllabus" rows="4" placeholder="Paste your syllabus or topic text here for accurate questions...">${(syllabusText || '').replace(/</g, '&lt;')}</textarea></div>
        <p style="font-size:0.8rem;color:var(--text-dim)">Generated questions are saved as <strong>drafts</strong>. Review them below, then click <strong>Publish</strong>.</p>
      `;
      showCustomModal('AI Generate Questions', html, async () => {
        const count = parseInt(document.getElementById('gen-count').value);
        const difficulty = document.getElementById('gen-difficulty').value;
        const text = document.getElementById('gen-syllabus').value.trim();
        try { await generateQuestions(examId, count, difficulty, text); showAlert('Questions generated and saved as drafts!', 'success'); closeModal(); await loadQuestions(); } catch (e) { showAlert(e.message, 'error'); }
      });
    }

    function showQuestionModal(q = null) {
      const isEdit = q !== null;
      const html = `
        <div class="form-group form-floating">
          <textarea class="form-textarea" id="q-text" placeholder=" ">${isEdit ? q.question_text : ''}</textarea>
          <label class="form-label">Question Text</label>
        </div>
        <div class="row">
          <div class="col-2"><div class="form-group form-floating"><input class="form-input" id="q-a" value="${isEdit ? q.option_a : ''}" placeholder=" "><label class="form-label">Option A</label></div></div>
          <div class="col-2"><div class="form-group form-floating"><input class="form-input" id="q-b" value="${isEdit ? q.option_b : ''}" placeholder=" "><label class="form-label">Option B</label></div></div>
        </div>
        <div class="row">
          <div class="col-2"><div class="form-group form-floating"><input class="form-input" id="q-c" value="${isEdit ? (q.option_c || '') : ''}" placeholder=" "><label class="form-label">Option C</label></div></div>
          <div class="col-2"><div class="form-group form-floating"><input class="form-input" id="q-d" value="${isEdit ? (q.option_d || '') : ''}" placeholder=" "><label class="form-label">Option D</label></div></div>
        </div>
        <div class="row">
          <div class="col-3"><div class="form-group"><label class="form-label">Correct Answer</label><select class="form-select" id="q-answer"><option value="A" ${isEdit && q.correct_answer === 'A' ? 'selected' : ''}>A</option><option value="B" ${isEdit && q.correct_answer === 'B' ? 'selected' : ''}>B</option><option value="C" ${isEdit && q.correct_answer === 'C' ? 'selected' : ''}>C</option><option value="D" ${isEdit && q.correct_answer === 'D' ? 'selected' : ''}>D</option></select></div>
          <div class="col-3"><div class="form-group"><label class="form-label">Difficulty</label><select class="form-select" id="q-difficulty"><option value="easy" ${isEdit && q.difficulty === 'easy' ? 'selected' : ''}>Easy</option><option value="medium" ${(!isEdit || q.difficulty === 'medium') ? 'selected' : ''}>Medium</option><option value="hard" ${isEdit && q.difficulty === 'hard' ? 'selected' : ''}>Hard</option></select></div>
          <div class="col-3"><div class="form-group form-floating"><input type="number" class="form-input" id="q-points" value="${isEdit ? (q.points || 1) : 1}" placeholder=" "><label class="form-label">Points</label></div></div>
        </div>
      `;
      const action = isEdit ? () => handleEditQuestion(q.id) : () => handleAddQuestion();
      showCustomModal(isEdit ? 'Edit Question' : 'Add Question', html, action);
    }

    async function handleAddQuestion() {
      const data = getQuestionFormData();
      if (!data) return;
      try { await addQuestion(examId, data); showAlert('Question added', 'success'); closeModal(); await loadQuestions(); } catch (e) { showAlert(e.message, 'error'); }
    }

    function editQuestion(id, idx) {
      getQuestionBank(examId).then(qs => { showQuestionModal(qs[idx]); });
    }

    async function handleEditQuestion(id) {
      const data = getQuestionFormData();
      if (!data) return;
      try { await updateQuestion(id, data); showAlert('Question updated', 'success'); closeModal(); await loadQuestions(); } catch (e) { showAlert(e.message, 'error'); }
    }

    function getQuestionFormData() {
      const text = document.getElementById('q-text').value.trim();
      const a = document.getElementById('q-a').value.trim();
      const b = document.getElementById('q-b').value.trim();
      if (!text || !a || !b) { showAlert('Question text, Option A, and Option B are required', 'error'); return null; }
      return {
        question_text: text,
        option_a: a, option_b: b,
        option_c: document.getElementById('q-c').value.trim() || null,
        option_d: document.getElementById('q-d').value.trim() || null,
        correct_answer: document.getElementById('q-answer').value,
        difficulty: document.getElementById('q-difficulty').value,
        points: parseInt(document.getElementById('q-points').value) || 1
      };
    }

    async function handleDeleteQ(id) {
      if (!await confirmAction('Delete this question?')) return;
      try { await deleteQuestion(id); showAlert('Question deleted', 'success'); await loadQuestions(); } catch (e) { showAlert(e.message, 'error'); }
    }

    async function handlePublish() {
      try { await publishQuestions(examId); showAlert('Questions published!', 'success'); await loadQuestions(); } catch (e) { showAlert(e.message, 'error'); }
    }

    async function handleAssign() {
      let students = [];
      try {
        const res = await loadStudents(1, 500);
        students = res.data || [];
      } catch (e) { showAlert(e.message, 'error'); return; }
      if (!students.length) { showAlert('No students available to assign questions to', 'error'); return; }
      const html = `
        <p style="margin-bottom:8px;color:var(--text-dim);font-size:0.85rem">Select students to receive the published question set for this exam:</p>
        <div style="max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px">
          ${students.map(s => `
            <label style="display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer">
              <input type="checkbox" class="assign-check" value="${s.id}">
              <span>${escHtml(s.name)}</span>
              <span style="margin-left:auto;font-size:0.8rem;color:var(--text-dim)">${escHtml(s.email || '')}</span>
            </label>`).join('')}
        </div>`;
      showCustomModal('Assign Questions to Students', html, async () => {
        const ids = Array.from(document.querySelectorAll('.assign-check:checked')).map(c => parseInt(c.value));
        if (!ids.length) { showAlert('Select at least one student', 'error'); return; }
        try {
          await assignQuestions(examId, ids);
          showAlert(`Questions assigned to ${ids.length} student(s)`, 'success');
          closeModal();
        } catch (e) { showAlert(e.message, 'error'); }
      });
    }

    function showCustomModal(title, bodyHtml, onConfirm) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay active';
      overlay.id = 'custom-modal';
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-header"><h3>${title}</h3><button class="modal-close" onclick="closeModal()">Ã—</button></div>
          <div class="modal-body">${bodyHtml}</div>
          <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" id="modal-confirm">Save</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      document.getElementById('modal-confirm').onclick = onConfirm;
    }

    function closeModal() { const m = document.getElementById('custom-modal'); if (m) m.remove(); }
  </script>
  <script src="../../js/nav.js?v=12"></script>
</body>
</html>
