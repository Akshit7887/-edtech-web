<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{if(localStorage.getItem('edtech-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');else if(localStorage.getItem('edtech-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Syllabus - EdTech AI Test &amp; Learning App</title>
  <link rel="stylesheet" href="../../css/main.css?v=5">
  <link rel="stylesheet" href="../../css/dashboard.css?v=5">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .syllabus-upload { margin-bottom: var(--space-6); padding: var(--space-6); background: var(--bg-card); border: 2px dashed var(--border-strong); border-radius: var(--radius-lg); text-align: center; transition: border-color var(--duration-normal) var(--ease); }
    .syllabus-upload.dragover { border-color: var(--accent); background: var(--accent-ghost); }
    .syllabus-upload input[type="file"] { display: none; }
    .syllabus-search { display: flex; gap: var(--space-3); margin-bottom: var(--space-6); }
    .syllabus-search input { flex: 1; }
    .syllabus-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-4); }
    .syllabus-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-5); transition: all var(--duration-normal) var(--ease); display: flex; flex-direction: column; }
    .syllabus-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
    .syllabus-card-icon { font-size: 2rem; margin-bottom: var(--space-3); }
    .syllabus-card h3 { font-size: var(--text-base); font-weight: 600; margin-bottom: var(--space-1); color: var(--text-heading); }
    .syllabus-card p { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-3); flex: 1; }
    .syllabus-card-meta { font-size: var(--text-xs); color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; padding-top: var(--space-3); border-top: 1px solid var(--border-light); }
    .syllabus-card-actions { display: flex; gap: var(--space-2); margin-top: var(--space-3); }
    .file-type-badge { font-size: 0.7rem; text-transform: uppercase; font-weight: 600; padding: 2px 8px; border-radius: var(--radius-full); background: var(--accent-ghost); color: var(--accent); }
    .empty-state { text-align: center; padding: var(--space-12); color: var(--text-muted); }
    .empty-state-icon { font-size: 3rem; margin-bottom: var(--space-4); opacity: 0.5; }
    .class-syllabus-block { margin-bottom: var(--space-8); }
    .class-syllabus-header { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); padding-bottom: var(--space-3); border-bottom: 2px solid var(--border-strong); }
    .class-syllabus-header-icon { font-size: 1.5rem; }
    .class-syllabus-header h2 { font-size: var(--text-lg); font-weight: 700; color: var(--text-heading); }
    .class-syllabus-header .class-meta { font-size: var(--text-sm); color: var(--text-muted); margin-top: 2px; }
    .class-syllabus-count { margin-left: auto; font-size: var(--text-xs); font-weight: 600; color: var(--text-muted); background: var(--bg-secondary); padding: 4px 12px; border-radius: var(--radius-full); white-space: nowrap; }
    .class-syllabus-empty { padding: var(--space-4); border: 1px dashed var(--border-strong); border-radius: var(--radius-lg); color: var(--text-muted); font-size: var(--text-sm); text-align: center; }
    .assign-class-select { width: 100%; margin-top: var(--space-1); font-size: var(--text-xs); }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="dashboard.html" class="navbar-brand">
      <span class="brand-logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8"/><path d="M8 11h6"/></svg></span>
      EdTech AI Test &amp; Learning App
    </a>
    <button class="hamburger-btn" aria-label="Open navigation menu" aria-expanded="false" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hamburger-icon"><line class="hamburger-line top" x1="3" y1="6" x2="21" y2="6"/><line class="hamburger-line mid" x1="3" y1="12" x2="21" y2="12"/><line class="hamburger-line bot" x1="3" y1="18" x2="21" y2="18"/></svg></button>
  </nav>
  <div class="layout">
    <aside class="sidebar">
      <ul class="sidebar-nav">
        <li><a href="dashboard.html"><span class="nav-icon">&#x1F4CA;</span><span>Dashboard</span></a></li>
        <li><a href="create-exam.html"><span class="nav-icon">&#x2795;</span><span>Create Exam</span></a></li>
        <li><a href="students.html"><span class="nav-icon">&#x1F465;</span><span>Students</span></a></li>
        <li><a href="classes.html"><span class="nav-icon">&#x1F3EB;</span><span>Classes</span></a></li>
        <li><a href="parent-contacts.html"><span class="nav-icon">&#x1F46A;</span><span>Parent Contacts</span></a></li>
        <li><a href="syllabus.html" class="active"><span class="nav-icon">&#x1F4DA;</span><span>Syllabus</span></a></li>
        <li><a href="#" onclick="logout()"><span class="nav-icon">&#x1F6AA;</span><span>Logout</span></a></li>
      </ul>
    </aside>
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Syllabus</h1>
          <p class="text-muted">Manage course syllabus files</p>
        </div>
        <button class="btn btn-primary" id="upload-btn" onclick="document.getElementById('file-input').click()">+ Upload Syllabus</button>
      </div>
      <div id="alert-container"></div>

      <div class="syllabus-upload" id="drop-zone">
        <p style="font-size:2rem;margin-bottom:var(--space-2);">&#x1F4C1;</p>
        <p style="font-weight:600;margin-bottom:var(--space-1);">Drop syllabus files here</p>
        <p class="text-muted text-sm">or click the button above to browse</p>
        <p class="text-muted text-xs" style="margin-top:var(--space-2);">PDF, DOC, DOCX, PPT, PPTX, TXT &mdash; Max 20MB</p>
      </div>

      <form id="upload-form" style="display:none">
        <input type="file" id="file-input" accept=".pdf,.doc,.docx,.ppt,.pptx,.txt" required>
        <div id="file-preview" style="display:none;margin-bottom:var(--space-3);padding:var(--space-4);background:var(--accent-ghost);border-radius:var(--radius-lg);"></div>
        <div class="form-group" style="margin-top:var(--space-3);display:flex;gap:var(--space-3);align-items:end;">
          <div style="flex:1;">
            <label class="form-label">Title</label>
            <input type="text" class="form-input" id="file-title" placeholder="e.g. Mathematics Syllabus" required>
          </div>
          <div style="flex:1;">
            <label class="form-label">Class</label>
            <select class="form-input" id="file-class" required>
              <option value="">Select a class...</option>
            </select>
          </div>
          <div style="flex:1;">
            <label class="form-label">Description (optional)</label>
            <input type="text" class="form-input" id="file-desc" placeholder="e.g. Unit 1 topics">
          </div>
          <button type="submit" class="btn btn-primary" id="upload-submit-btn">Upload</button>
          <button type="button" class="btn btn-secondary" onclick="cancelUpload()">Cancel</button>
        </div>
      </form>

      <div class="syllabus-search">
        <select class="form-input" id="class-filter" style="max-width:240px;" onchange="applyFilter()">
          <option value="">All classes</option>
        </select>
        <input type="text" class="form-input" id="search-input" placeholder="Search syllabus files..." oninput="applyFilter()">
      </div>

      <div id="syllabus-grid" class="syllabus-grid"></div>
    </main>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    let currentFile = null;
    let teacherClasses = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireRole('teacher')) return;
      await loadTeacherClasses();
      loadFiles();
      startPolling(loadFiles, 60000);
      window.addEventListener('beforeunload', stopPolling);

      const dropZone = document.getElementById('drop-zone');
      dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        const files = e.dataTransfer.files;
        if (files.length > 0) handleFileSelect(files[0]);
      });

      document.getElementById('file-input').addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleFileSelect(e.target.files[0]);
      });

      document.getElementById('upload-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('file-title').value.trim();
        const desc = document.getElementById('file-desc').value.trim();
        const classId = document.getElementById('file-class').value;
        if (!title || !currentFile) return;
        if (!classId) {
          showAlert('Please select a class for this syllabus file', 'error');
          return;
        }

        const sizeStr = currentFile.size > 1024 * 1024 ? (currentFile.size / 1024 / 1024).toFixed(1) + ' MB' : (currentFile.size / 1024).toFixed(0) + ' KB';
        const clsName = teacherClasses.find(c => c.id === parseInt(classId));
        if (!confirm('Upload this file?\n\nFile: ' + currentFile.name + '\nSize: ' + sizeStr + '\nType: ' + (currentFile.type || 'Unknown') + '\nTitle: ' + title + '\nClass: ' + (clsName ? clsName.name : 'Unknown') + '\n\nClick OK to confirm upload.')) return;

        const btn = document.getElementById('upload-submit-btn');
        btn.disabled = true; btn.textContent = 'Uploading...';

        try {
          const fd = new FormData();
          fd.append('title', title);
          fd.append('class_id', classId);
          if (desc) fd.append('description', desc);
          fd.append('file', currentFile);
          await api.uploadFile('/api/syllabus/upload', fd);
          cancelUpload();
          alert('✅ File uploaded successfully!');
          showAlert('File uploaded successfully', 'success');
          loadFiles();
        } catch (e) {
          showAlert(e.message || 'Upload failed', 'error');
          btn.disabled = false; btn.textContent = 'Upload';
        }
      });
    });

    async function loadTeacherClasses() {
      try {
        const res = await api.get('/api/teacher/classes');
        teacherClasses = res.data || [];
        const opts = teacherClasses.map(c => `<option value="${c.id}">${escHtml(c.name)}${c.subject ? ' - ' + escHtml(c.subject) : ''}</option>`).join('');
        document.getElementById('file-class').innerHTML = '<option value="">Select a class...</option>' + opts;
        document.getElementById('class-filter').innerHTML = '<option value="">All classes</option>' + opts;
      } catch (e) {
        showAlert('Failed to load classes: ' + (e.message || ''), 'error');
      }
    }

    function handleFileSelect(file) {
      if (file.size > 20 * 1024 * 1024) {
        showAlert('File too large. Maximum size is 20MB.', 'error');
        return;
      }
      var ext = file.name.split('.').pop().toLowerCase();
      var allowed = ['pdf','doc','docx','ppt','pptx','txt'];
      if (allowed.indexOf(ext) === -1) {
        showAlert('Invalid file type. Allowed: PDF, DOC, DOCX, PPT, PPTX, TXT', 'error');
        return;
      }
      currentFile = file;
      document.getElementById('file-title').value = file.name.replace(/\.[^.]+$/, '');
      document.getElementById('file-desc').value = '';
      document.getElementById('upload-form').style.display = 'flex';
      document.getElementById('upload-form').style.flexDirection = 'column';
      document.getElementById('upload-btn').disabled = true;

      var sizeStr = file.size > 1024 * 1024 ? (file.size / 1024 / 1024).toFixed(1) + ' MB' : (file.size / 1024).toFixed(0) + ' KB';
      var icon = ext === 'pdf' ? '&#x1F4C4;' : ext === 'doc' || ext === 'docx' ? '&#x1F4DD;' : ext === 'ppt' || ext === 'pptx' ? '&#x1F4CA;' : '&#x1F4C1;';
      document.getElementById('file-preview').innerHTML = '<div style="display:flex;align-items:center;gap:var(--space-3);"><span style="font-size:2rem;">' + icon + '</span><div><strong>' + escHtml(file.name) + '</strong><br><span class="text-muted text-sm">' + sizeStr + ' &middot; ' + ext.toUpperCase() + '</span></div></div>';
      document.getElementById('file-preview').style.display = 'block';
    }

    function cancelUpload() {
      currentFile = null;
      document.getElementById('upload-form').style.display = 'none';
      document.getElementById('file-input').value = '';
      document.getElementById('file-preview').style.display = 'none';
      document.getElementById('file-preview').innerHTML = '';
      document.getElementById('upload-btn').disabled = false;
      document.getElementById('file-class').value = '';
    }

    async function loadFiles() {
      const grid = document.getElementById('syllabus-grid');
      grid.innerHTML = '<div class="empty-state"><div class="spinner"></div><p>Loading files...</p></div>';
      try {
        const res = await api.get('/api/syllabus');
        renderFiles(res.data || []);
      } catch (e) {
        grid.innerHTML = '<div class="empty-state"><p>Failed to load syllabus files</p></div>';
      }
    }

    function applyFilter() {
      const q = document.getElementById('search-input').value.trim().toLowerCase();
      const classFilter = document.getElementById('class-filter').value;
      const grid = document.getElementById('syllabus-grid');
      grid.innerHTML = '<div class="empty-state"><div class="spinner"></div><p>Filtering...</p></div>';
      api.get('/api/syllabus').then(res => {
        let files = res.data || [];
        if (classFilter) files = files.filter(f => String(f.class_id || '') === classFilter);
        if (q) files = files.filter(f =>
          (f.title || '').toLowerCase().includes(q) ||
          (f.description || '').toLowerCase().includes(q) ||
          (f.class_name || '').toLowerCase().includes(q)
        );
        renderFiles(files);
      }).catch(() => {
        grid.innerHTML = '<div class="empty-state"><p>Search failed</p></div>';
      });
    }

    function renderFiles(files) {
      const grid = document.getElementById('syllabus-grid');
      if (!files.length) {
        grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#x1F4DA;</div><p>No syllabus files available</p></div>';
        return;
      }

      const grouped = new Map();
      const unassigned = [];
      files.forEach(f => {
        if (!f.class_id) { unassigned.push(f); return; }
        if (!grouped.has(f.class_id)) grouped.set(f.class_id, { id: f.class_id, name: f.class_name || 'Class ' + f.class_id, subject: f.class_subject, files: [] });
        grouped.get(f.class_id).files.push(f);
      });

      const classOpts = teacherClasses.map(c => `<option value="${c.id}">${escHtml(c.name)}</option>`).join('');
      const blocks = [];

      [...grouped.values()].forEach(g => {
        blocks.push(`
          <div class="class-syllabus-block">
            <div class="class-syllabus-header">
              <span class="class-syllabus-header-icon">&#x1F3EB;</span>
              <div>
                <h2>${escHtml(g.name)}</h2>
                ${g.subject ? '<div class="class-meta">' + escHtml(g.subject) + '</div>' : ''}
              </div>
              <span class="class-syllabus-count">${g.files.length} file${g.files.length !== 1 ? 's' : ''}</span>
            </div>
            <div class="syllabus-grid">${g.files.map(f => fileCard(f, classOpts)).join('')}</div>
          </div>`);
      });

      if (unassigned.length) {
        blocks.push(`
          <div class="class-syllabus-block">
            <div class="class-syllabus-header">
              <span class="class-syllabus-header-icon">&#x1F4C1;</span>
              <div>
                <h2>Unassigned</h2>
                <div class="class-meta">Files not linked to any class yet</div>
              </div>
              <span class="class-syllabus-count">${unassigned.length} file${unassigned.length !== 1 ? 's' : ''}</span>
            </div>
            <div class="syllabus-grid">${unassigned.map(f => fileCard(f, classOpts)).join('')}</div>
          </div>`);
      }

      grid.innerHTML = blocks.join('');
    }

    function fileCard(f, classOpts) {
      const ext = (f.file_name || '').split('.').pop().toUpperCase();
      const icon = ext === 'PDF' ? '&#x1F4C4;' : ext === 'DOC' || ext === 'DOCX' ? '&#x1F4DD;' : ext === 'PPT' || ext === 'PPTX' ? '&#x1F4CA;' : '&#x1F4C1;';
      const size = f.file_size > 1024 * 1024 ? (f.file_size / 1024 / 1024).toFixed(1) + ' MB' : (f.file_size / 1024).toFixed(0) + ' KB';
      const url = `${API_BASE}/api/syllabus/${f.id}/download`;
      const assign = f.class_id
        ? `<div class="file-type-badge" style="background:var(--bg-secondary);color:var(--text-muted);">&#x1F3EB; ${escHtml(f.class_name || '')}</div>`
        : `<select class="form-input assign-class-select" onchange="assignClass(${f.id}, this.value)"><option value="">Assign class...</option>${classOpts}</select>`;
      return `<div class="syllabus-card">
          <div class="syllabus-card-icon">${icon}</div>
          <h3>${escHtml(f.title)}</h3>
          <p>${f.description ? escHtml(f.description) : 'No description'}</p>
          <div class="syllabus-card-meta">
            <span class="file-type-badge">${ext}</span>
            <span>${size}</span>
          </div>
          ${assign}
          <div class="syllabus-card-meta">
            <span>by ${escHtml(f.uploader_name || 'Unknown')}</span>
            <span>${formatDate(f.created_at)}</span>
          </div>
          <div class="syllabus-card-actions">
            <a href="${url}" class="btn btn-sm btn-primary" target="_blank" download>Download</a>
            <button class="btn btn-sm btn-secondary" onclick="deleteFile(${f.id})">Delete</button>
          </div>
        </div>`;
    }

    async function assignClass(id, classId) {
      try {
        await api.request('PATCH', '/api/syllabus/' + id, { class_id: classId ? parseInt(classId) : null });
        showAlert(classId ? 'File linked to class' : 'File unlinked from class', 'success');
        loadFiles();
      } catch (e) {
        showAlert(e.message || 'Update failed', 'error');
        loadFiles();
      }
    }

    async function deleteFile(id) {
      if (!confirm('Delete this syllabus file?')) return;
      try {
        await api.del('/api/syllabus/' + id);
        showAlert('File deleted', 'success');
        loadFiles();
      } catch (e) {
        showAlert(e.message || 'Delete failed', 'error');
      }
    }

    function escHtml(s) {
      if (!s) return '';
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/animations.js"></script>
